<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عين الحقيقة · وحدة التحقيق السيبرانية (V15 - التصميم النهائي)</title>
    
    <!-- Tailwind & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>

    <style>
        /* ========== HARDCORE CYBERPUNK FORENSICS ========== */
        :root {
            --bg-base: #000000;
            --panel-bg: rgba(5, 5, 10, 0.85);
            --neon-cyan: #00f3ff;
            --neon-green: #39ff14;
            --neon-red: #ff003c;
            --neon-yellow: #fcee0a;
            --neon-purple: #b026ff;
            --grid-color: rgba(0, 243, 255, 0.1);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-base);
            color: #fff;
            margin: 0;
            overflow-x: hidden;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 50px 50px;
            background-position: center center;
            animation: moveGrid 15s linear infinite;
            min-height: 100vh;
        }

        @keyframes moveGrid {
            0% { background-position: 0 0; }
            100% { background-position: 50px 50px; }
        }

        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.15) 1px, transparent 1px, transparent 2px);
            pointer-events: none;
            z-index: 999;
        }

        .font-tech { font-family: 'Space Mono', monospace; }

        .cyber-box {
            background: var(--panel-bg);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.2), inset 0 0 20px rgba(0, 243, 255, 0.1);
            position: relative;
            clip-path: polygon(0 0, calc(100% - 30px) 0, 100% 30px, 100% 100%, 30px 100%, 0 calc(100% - 20px));
        }

        .hud-viewport {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            min-height: 450px;
            background: radial-gradient(circle at center, #0a1128 0%, #000 100%);
            border: 2px solid var(--neon-cyan);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            box-shadow: inset 0 0 100px rgba(0, 243, 255, 0.1);
            clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
            transition: border-color 0.5s ease, box-shadow 0.5s ease;
        }

        .target-reticle {
            position: absolute; width: 150px; height: 150px; border: 2px dashed var(--neon-cyan);
            border-radius: 50%; animation: spin 8s linear infinite; opacity: 0.5; pointer-events: none;
        }
        .target-reticle::before, .target-reticle::after {
            content: ''; position: absolute; top: 50%; left: -20px; right: -20px; height: 1px; background: var(--neon-cyan);
        }
        .target-reticle::after { transform: rotate(90deg); }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        #image-preview {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            padding: 20px; box-sizing: border-box; object-fit: contain; z-index: 10; display: none;
            transition: filter 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .laser-scanner {
            position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: #fff;
            box-shadow: 0 0 20px 5px var(--neon-cyan), 0 0 40px 15px rgba(0, 243, 255, 0.6);
            z-index: 25; display: none; animation: aggressiveScan 2s ease-in-out infinite alternate;
        }
        @keyframes aggressiveScan { 0% { top: 0%; } 100% { top: calc(100% - 4px); } }

        .terminal {
            background: #020202; border: 1px solid var(--neon-cyan); border-right: 4px solid var(--neon-cyan);
            padding: 1.5rem; height: 280px; overflow-y: hidden; font-size: 0.85rem;
            color: var(--neon-green); direction: ltr; text-align: left; position: relative;
        }
        
        .terminal::before {
            content: "LIVE_FEED_ACTV"; position: absolute; top: 5px; right: 10px;
            color: var(--neon-red); font-size: 0.6rem; animation: pulse 1s infinite;
        }

        .btn-nuke {
            background: rgba(0, 243, 255, 0.1); border: 2px solid var(--neon-cyan); color: var(--neon-cyan);
            text-transform: uppercase; font-weight: 900; letter-spacing: 2px;
            transition: all 0.2s; position: relative; overflow: hidden;
        }
        .btn-nuke:hover:not(:disabled) { background: var(--neon-cyan); color: #000; box-shadow: 0 0 40px var(--neon-cyan); transform: scale(1.02); }
        .btn-nuke:disabled { opacity: 0.3; cursor: not-allowed; }

        .alert-fake {
            background: #1a0000 !important; border-color: var(--neon-red) !important;
            box-shadow: 0 0 50px rgba(255,0,60,0.4), inset 0 0 50px rgba(255,0,60,0.2) !important;
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; color: var(--neon-red);
        }
        .alert-real {
            background: #001a0a !important; border-color: var(--neon-green) !important;
            box-shadow: 0 0 50px rgba(57,255,20,0.3), inset 0 0 50px rgba(57,255,20,0.1) !important;
            color: var(--neon-green);
        }

        @keyframes shake { 10%, 90% { transform: translate3d(-2px, 0, 0); } 20%, 80% { transform: translate3d(4px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-8px, 0, 0); } 40%, 60% { transform: translate3d(8px, 0, 0); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

        #math-canvas { display: none !important; }
        .flag-item { padding: 4px 8px; border-right: 3px solid currentColor; background: rgba(255,255,255,0.05); margin-bottom: 5px; font-size: 0.75rem; color: #fff; }
        
        /* New Verdict Placement */
        .verdict-box-final {
            margin-top: 1rem;
            min-height: 220px;
        }
    </style>
</head>

    <canvas id="math-canvas"></canvas>

    <script>
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwONEMuNxRrCMshbhtqrj7eBxHq90-g7W6V4LG-vumAlfNUN2IKf7pZqGUkdk8g3ZJp/exec'; 
        
        let currentSystemVerdict = '';
        let uploadedFileBase64 = '';
        let uploadedFileName = '';
        let uploadedMimeType = '';
        let imgData = { hasCameraEXIF: false, hasAIEXIF: false, hasSocial: false, isAIRes: false, width: 0, height: 0 };

        setInterval(() => {
            const now = new Date();
            document.getElementById('sys-time').innerText = now.toLocaleTimeString('en-US', {hour12: false});
        }, 1000);

        const UI = {
            fileInput: document.getElementById('file-input'),
            viewport: document.getElementById('hud-viewport'),
            preview: document.getElementById('image-preview'),
            uploadTxt: document.getElementById('upload-content'),
            analyzeBtn: document.getElementById('analyze-btn'),
            terminal: document.getElementById('terminal-content'),
            laser: document.getElementById('laser-scanner'),
            verdict: document.getElementById('verdict-area'),
            reticle: document.getElementById('reticle'),
            telemetryContainer: document.getElementById('telemetry-input-container')
        };

        UI.viewport.onclick = () => UI.fileInput.click();
        UI.fileInput.onchange = (e) => { if (e.target.files[0]) processFile(e.target.files[0]); };

        function logToTerminal(text, color = 'var(--neon-green)') {
            const p = document.createElement('div');
            p.style.color = color;
            p.innerHTML = `> ${text}`;
            UI.terminal.appendChild(p);
            if(UI.terminal.children.length > 8) UI.terminal.removeChild(UI.terminal.firstChild);
        }

        function processFile(file) {
            if (!file.type.startsWith('image/')) return;
            uploadedFileName = file.name;
            uploadedMimeType = file.type;
            document.getElementById('meta-size').innerText = (file.size / 1024).toFixed(1) + ' KB';
            document.getElementById('meta-format').innerText = file.name.split('.').pop().toUpperCase();

            const reader = new FileReader();
            reader.onload = (e) => {
                UI.preview.src = e.target.result;
                uploadedFileBase64 = e.target.result.split(',')[1];
                UI.preview.style.display = 'block';
                UI.uploadTxt.style.display = 'none';
                UI.reticle.style.display = 'none';
                UI.analyzeBtn.disabled = false;
                UI.verdict.style.display = 'none';
                UI.telemetryContainer.style.display = 'flex'; // Reset terminal visibility
                
                UI.preview.style.filter = 'none';
                UI.viewport.style.borderColor = 'var(--neon-cyan)';
                UI.viewport.style.boxShadow = 'inset 0 0 100px rgba(0, 243, 255, 0.1)';
                
                UI.preview.onload = () => {
                    imgData.width = UI.preview.naturalWidth;
                    imgData.height = UI.preview.naturalHeight;
                    document.getElementById('meta-res').innerText = `${imgData.width}x${imgData.height}`;
                };
                logToTerminal(`PAYLOAD_ACQUIRED: ${file.name}`, "var(--neon-yellow)");
            };
            reader.readAsDataURL(file);

            const binReader = new FileReader();
            binReader.onload = (e) => {
                const buffer = e.target.result;
                const binStr = new Uint8Array(buffer).reduce((acc, byte) => acc + String.fromCharCode(byte), "").slice(0, 65536);
                EXIF.getData(file, function() {
                    const make = EXIF.getTag(this, "Make");
                    imgData.hasCameraEXIF = !!make;
                    document.getElementById('meta-exif').innerText = make ? "DETECTED" : "STRIPPED";
                });
            };
            binReader.readAsArrayBuffer(file);
        }

        UI.analyzeBtn.onclick = async () => {
            UI.analyzeBtn.disabled = true;
            UI.laser.style.display = 'block';
            logToTerminal("INITIATING SCAN SEQUENCE...", "var(--neon-cyan)");
            setTimeout(() => runAnalysis(), 2500);
        };

        async function runAnalysis() {
            const canvas = document.getElementById('math-canvas');
            const ctx = canvas.getContext('2d');
            const img = UI.preview;
            const scale = Math.min(1, 800 / Math.max(img.naturalWidth, img.naturalHeight));
            const w = Math.floor(img.naturalWidth * scale), h = Math.floor(img.naturalHeight * scale);
            canvas.width = w; canvas.height = h;
            ctx.drawImage(img, 0, 0, w, h);
            const data = ctx.getImageData(0, 0, w, h).data;

            let luma = new Float32Array(w * h);
            for(let i=0; i<w*h; i++) luma[i] = 0.299*data[i*4] + 0.587*data[i*4+1] + 0.114*data[i*4+2];

            let gDead = 0, gTotal = 0, rDead = new Array(16).fill(0), rTotal = new Array(16).fill(0);
            for(let y=1; y<h-1; y++) {
                for(let x=1; x<w-1; x++) {
                    let gx = (luma[(y-1)*w+x+1] + 2*luma[y*w+x+1] + luma[(y+1)*w+x+1]) - (luma[(y-1)*w+x-1] + 2*luma[y*w+x-1] + luma[(y+1)*w+x-1]);
                    let gy = (luma[(y+1)*w+x-1] + 2*luma[(y+1)*w+x] + luma[(y+1)*w+x+1]) - (luma[(y-1)*w+x-1] + 2*luma[(y-1)*w+x] + luma[(y-1)*w+x+1]);
                    let mag = Math.abs(gx) + Math.abs(gy);
                    let ridx = Math.floor((y/h)*4)*4 + Math.floor((x/w)*4);
                    rTotal[ridx]++; gTotal++;
                    if(mag <= 2.5) { rDead[ridx]++; gDead++; }
                }
            }

            let gRatio = (gDead/gTotal)*100, maxR = 0, minR = 100;
            rTotal.forEach((t, i) => { if(t>0) { let r = (rDead[i]/t)*100; maxR = Math.max(maxR, r); minR = Math.min(minR, r); }});
            let spike = maxR - minR;

            let state = (gRatio > 18 || spike > 18) ? "FAKE" : "REAL";
            currentSystemVerdict = state;
            
            UI.laser.style.display = 'none';
            renderVerdict(state, gRatio, spike);
        }

        function renderVerdict(state, gRatio, spike) {
            UI.verdict.style.display = 'flex';
            UI.verdict.classList.remove('alert-fake', 'alert-real');
            UI.verdict.classList.add(state === "FAKE" ? 'alert-fake' : 'alert-real');
            
            // HIDE TERMINAL AND SCANNER BUTTON
            UI.telemetryContainer.style.display = 'none';

            document.getElementById('verdict-icon').innerText = state === "FAKE" ? 'X' : '✓';
            document.getElementById('verdict-text').innerText = state === "FAKE" ? 'تلاعب مُكتشف' : 'أصيلة وموثوقة';

            if(state === "FAKE") {
                UI.preview.style.filter = 'contrast(1.5) brightness(0.8) grayscale(100%) sepia(100%) hue-rotate(320deg) saturate(500%)';
                UI.viewport.style.borderColor = 'var(--neon-red)';
                UI.viewport.style.boxShadow = 'inset 0 0 150px rgba(255, 0, 60, 0.5)';
            } else {
                UI.preview.style.filter = 'contrast(1.2) brightness(1.1) saturate(150%) hue-rotate(90deg)';
                UI.viewport.style.borderColor = 'var(--neon-green)';
                UI.viewport.style.boxShadow = 'inset 0 0 150px rgba(57, 255, 20, 0.3)';
            }

            const flags = document.getElementById('flags-container');
            flags.innerHTML = '';
            const msg = state === "FAKE" ? "رصد تناقض حاد في توزيع البيكسلات يطابق التزييف الموضعي." : "مصفوفة البيانات نظيفة، التوزيع الرياضي يطابق العدسات الطبيعية.";
            const div = document.createElement('div'); div.className = 'flag-item'; div.innerText = '• ' + msg;
            flags.appendChild(div);
            
            logToTerminal(state === "FAKE" ? "!!! ALERT: MANIPULATION DETECTED !!!" : "SUCCESS: ASSET AUTHENTICATED", state === "FAKE" ? 'var(--neon-red)' : 'var(--neon-green)');
        }

        async function submitUserValidation(userVerdict) {
            document.getElementById('user-validation-panel').style.display = 'none';
            document.getElementById('report-actions').classList.remove('hidden');
            
            const payload = { filename: uploadedFileName, mimeType: uploadedMimeType, base64: uploadedFileBase64, systemVerdict: currentSystemVerdict, userVerdict: userVerdict };
            fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            logToTerminal("FEEDBACK_STORED_IN_CLOUD_REPOSITORY.", "var(--neon-cyan)");
        }

        document.getElementById('download-report-btn').onclick = function() {
            const btn = this;
            btn.innerHTML = 'يتم الاستخراج...';
            htmlToImage.toPng(document.getElementById('export-container'), { backgroundColor: '#000' })
                .then(url => { 
                    const a = document.createElement('a'); a.href = url; 
                    a.download = `FORENSIC_REPORT_${Date.now()}.png`; 
                    a.click(); 
                    btn.innerHTML = 'استخراج التقرير';
                });
        };
    </script>
</body>
</html>
